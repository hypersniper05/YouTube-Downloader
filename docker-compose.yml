version: '3.8'

services:
  ytdl-web:
    build: .
    container_name: ytdl-web
    ports:
      - "0.0.0.0:6080:8080"
    volumes:
      # Persist downloads (optional - remove if you don't need to keep files)
      - ./downloads:/app/downloads
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - EXTERNAL_PORT=6080
